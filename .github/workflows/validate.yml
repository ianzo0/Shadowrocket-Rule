name: Validate configuration

on:
  push:
  pull_request:

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check expected files
        run: |
          test ! -e ianzo-rule.conf
          for config in ianzo-rule-cn.conf ianzo-rule-full.conf ianzo-rule-gfw.conf; do
            test -s "$config"
            grep -q '^\[General\]$' "$config"
            grep -q '^\[Proxy Group\]$' "$config"
            grep -q '^\[Rule\]$' "$config"
            grep -q '^FINAL,' "$config"
            ! grep -q 'RULE-SET,https://[^,]*🎵' "$config"
            ! grep -Eiq '(password|secret|token|private[_-]?key|订阅链接)' "$config"
          done
          test -s README.md
          test -s LICENSE
      - name: Check remote rule links
        run: |
          for config in ianzo-rule-cn.conf ianzo-rule-full.conf ianzo-rule-gfw.conf; do
            while IFS=, read -r _ url _; do
              curl --fail --silent --show-error --location --retry 2 --max-time 20 "$url" >/dev/null
            done < <(grep '^RULE-SET,https://' "$config")
          done
