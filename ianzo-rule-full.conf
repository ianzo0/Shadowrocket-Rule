# Loyalsoldier 私有网络规则集作为兜底补充，确保遗漏的局域网域名仍保持直连。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/private.txt,DIRECT
# Loyalsoldier 广告规则集统一交由 REJECT 拦截；规则内容与更新由上游维护。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt,REJECT
# Loyalsoldier 直连规则集交由“🔒 国内网络”策略，默认直连但允许用户手动调整。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,🔒 国内网络
# Loyalsoldier 代理规则集交由“🚀 节点选择”策略，并通过远程 DNS 降低本地 DNS 污染的影响。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt,🚀 节点选择,force-remote-dns
# 中国大陆 IP 地址默认使用“🔒 国内网络”策略；数据库准确度受 Shadowrocket 内置 GeoIP 数据影响。
GEOIP,CN,🔒 国内网络

# 兜底规则：所有未匹配流量都交由“🐟 未命中的境外流量”策略组决定去向。
FINAL,🐟 未命中的境外流量

# 静态域名映射区域：指定少量本地服务域名的固定解析结果。
[Host]
# 将 localhost 固定解析为本机回环地址。
localhost = 127.0.0.1
# 将微信本地回调域名固定解析为本机回环地址，避免外部 DNS 干扰。
localhost.weixin.qq.com = 127.0.0.1

# URL Rewrite 区域：将中国 Google 入口重定向到国际 Google 主站。
[URL Rewrite]
# 将 g.cn 及其 www 子域的 HTTP/HTTPS 请求重定向到 www.google.com。
^https?://(?:www\.)?g\.cn(?:[/?#]|$) https://www.google.com 302
# 将 google.cn 及其 www 子域的 HTTP/HTTPS 请求重定向到 www.google.com。
^https?://(?:www\.)?google\.cn(?:[/?#]|$) https://www.google.com 302

# MITM 区域：仅解密 Google 中国入口域名，使 HTTPS 请求可应用上述重写规则。
[MITM]
# 仅对 g.cn 与 google.cn 的根域及子域启用 HTTPS 解密；使用前必须在 Shadowrocket 安装并信任 CA 证书。
hostname = g.cn,*.g.cn,google.cn,*.google.cn
